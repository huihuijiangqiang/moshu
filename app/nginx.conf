server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker may recreate the API container during a rolling update. Resolve
    # the service name through Docker DNS periodically instead of pinning the
    # old container IP for the lifetime of this Nginx process.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        client_max_body_size 24m;
        # Variable proxy_pass needs an explicit rewrite to preserve the
        # original API path while removing the frontend-only /api prefix.
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 660s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
