x-server-environment: &server-environment
  DATABASE_URL: postgresql+asyncpg://moshu:moshu@postgres:5432/moshu
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  BUILD_REVISION: ${MOSHU_BUILD_REVISION:-local}
  PRODUCTION_ASSET_DIR: /app/.local/production-assets
  # Compose runs behind the frontend proxy by default. Keep production-safe
  # defaults while allowing a deployment to override the public origin.
  DEBUG: ${MOSHU_DEBUG:-false}
  PUBLIC_APP_URL: ${MOSHU_PUBLIC_APP_URL:-http://localhost:8080}
  CORS_ORIGINS: ${MOSHU_CORS_ORIGINS:-http://localhost:8080}

x-server-base: &server-base
  build:
    context: ./server
    dockerfile: Dockerfile
  env_file:
    - ./server/.env
  environment: *server-environment

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: moshu
      POSTGRES_USER: moshu
      POSTGRES_PASSWORD: moshu
    ports:
      # The application uses the internal postgres:5432 address. Keep the host
      # port configurable so a local PostgreSQL service cannot block startup.
      - "${MOSHU_POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - ${MOSHU_POSTGRES_DATA_DIR:-./.docker-data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moshu -d moshu"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ${MOSHU_REDIS_DATA_DIR:-./.docker-data/redis}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migration:
    <<: *server-base
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *server-base
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ${MOSHU_PRODUCTION_ASSET_DATA_DIR:-./.docker-data/production-assets}:/app/.local/production-assets
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
        VITE_USE_MOCK: "false"
    ports:
      - "${MOSHU_FRONTEND_HOST_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/api/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    <<: *server-base
    # Consume the legacy default queue during rolling upgrades so acknowledged
    # work from older deployments is drained instead of orphaned.
    volumes:
      - ${MOSHU_PRODUCTION_ASSET_DATA_DIR:-./.docker-data/production-assets}:/app/.local/production-assets
    command: ["celery", "-A", "celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "--queues=consistency,generation,celery"]
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  dispatcher:
    <<: *server-base
    command: ["celery", "-A", "celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--queues=outbox", "--hostname=outbox@%h"]
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    <<: *server-base
    command: ["celery", "-A", "celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
