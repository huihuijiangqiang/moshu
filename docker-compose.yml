services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: moshu
      POSTGRES_USER: moshu
      POSTGRES_PASSWORD: moshu
    ports:
      - "5432:5432"
    volumes:
      - moshu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moshu -d moshu"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - moshu_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  moshu_postgres_data:
  moshu_redis_data:
